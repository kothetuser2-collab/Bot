name: Run Telegram Bot

on:
  workflow_dispatch:  # ကိုယ်တိုင်နှိပ်ပြီး စတင်ရန်

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # 6 နာရီထက် အနည်းငယ်လျော့ပါ၊ ကြိုတင်သတိပေးချက် ရရှိရန်

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (OpenCV အတွက်)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telebot aiohttp opencv-python-headless ddddocr numpy

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python me.py
