name: Run Telegram Bot

on:
  workflow_dispatch:  # ကိုယ်တိုင်နှိပ်ပြီး Run ရန်
  schedule:
    - cron: '0 */6 * * *'  # ၆ နာရီတစ်ခါ အလိုအလျောက် Run ရန်

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # အများဆုံး ခွင့်ပြုချိန် (၅ နာရီ ၅၀ မိနစ်)

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Bot
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}  # GitHub Secrets မှ Token ကို ယူမည်
        BOT_PORT: 8080
      run: python me.py
